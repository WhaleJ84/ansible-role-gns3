---
- name: INSTALL | GNS3
  tags:
    - install
  block:
    - name: INSTALL | Ensure GNS3 repository is present
      become: true
      ansible.builtin.deb822_repository:
        name: gns3
        types: deb
        uris: http://ppa.launchpad.net/gns3/ppa/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components:
          - main
        architectures:
          - "{{ 'amd64' if ansible_architecture == 'x86_64' else null }}"
          - "{{ 'i386' if iou_support else null }}"
        signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xB83AAABFFBD82D21B543C8EA86C22C2EC6A24D7F
      register: keychain

    - name: REGISTER | Get foreign dpkg architectures
      changed_when: false
      ansible.builtin.command:
        cmd: dpkg --print-foreign-architectures
      register: architectures

    - name: INSTALL | Ensure i386 architecture is enabled in dpkg
      become: true
      when: iou_support and "i386" not in architectures.stdout
      notify: Update apt repository
      ansible.builtin.command:
        cmd: "dpkg --add-architecture i386"

    - name: INSTALL | Ensure GNS3 is installed
      become: true
      ansible.builtin.apt:
        name:
          - gns3-gui
          - gns3-server
          - "{{ 'gns3-iou' if iou_support else null }}"
        state: present
        update_cache: "{{ true if keychain.changed else false }}"

- name: CONFIGURE | GNS3
  tags:
    - configure
  block:
    - name: CONFIGURE | Lookup files in default path
      ansible.builtin.find:
        paths: "{{ default_path }}"
        file_type: directory
      register: default_dirs

    - name: CONFIGURE | Save directories in default path to variable
      ansible.builtin.set_fact:
        found_dirs: "{{ default_dirs.files | map(attribute='path') | flatten }}"

    - name: CONFIGURE | Ensure images folder exists
      ansible.builtin.file:
        path: "{{ images_path | dirname }}"
        state: directory

    - name: CONFIGURE | Ensure images path is set
      community.general.ini_file:
        path: "{{ settings_path }}/gns3_server.conf"
        section: "Server"
        option: "images_path"
        value: "{{ images_path }}"
      register: ini_result

    - name: CONFIGURE | Save old path of images when custom path is set
      when: "'images' in item and ini_result.changed"
      ansible.builtin.set_fact:
        old_path: "{{ item }}"
      loop: "{{ found_dirs }}"
      loop_control:
        loop_var: item

    - name: CONFIGURE | Move images folder to new directory when not default
      ansible.builtin.command:
        cmd: "mv {{ old_path }} {{ images_path }}"
      when: old_path is defined and old_path != images_path
      notify:
        - Lookup files in default path
        - Save directories in default path to variable

    - name: CONFIGURE | Check for file changes if any
      ansible.builtin.meta: flush_handlers

    - name: CONFIGURE | Ensure projects folder exists
      ansible.builtin.file:
